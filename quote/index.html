<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MotivaStory</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #f4e5d6;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      width: 100%;
      background: #e1cbb2;
      display: flex;
      align-items: center;
      padding: 15px 30px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    header .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header img {
      height: 40px;
    }
    header h1 {
      font-size: 26px;
      color: #5a3a1a;
      margin: 0;
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      padding: 40px;
      box-sizing: border-box;
    }

    .quote-box {
      flex: 1;
      max-width: 30%;  /* smaller width */
      background: #fff8f0;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .story-box {
      flex: 2;
      max-width: 65%;  /* larger width */
      background: #fff8f0;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
      text-align: justify;
      line-height: 1.7;
    }

    .story-box h2, .quote-box h2 {
      font-size: 26px;
      margin-bottom: 20px;
      text-align: center;
      color: #5a3a1a;
    }

    #story {
      font-size: 18px;
      color: #3b2a1d;
    }

    #quote {
      font-size: 20px;
      font-style: italic;
      color: #3b2a1d;
    }

    /* BUTTON */
    .btn-container {
      display: flex;
      justify-content: center;
      padding: 25px;
    }
    button {
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      background: #efc69b;
      color: #3b2a1d;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      background: #d9ad82;
    }

    /* FOOTER */
    footer {
      width: 100%;
      background: #e1cbb2;
      text-align: right;
      padding: 12px 30px;
      box-sizing: border-box;
      font-size: 14px;
      color: #5a3a1a;
    }
    footer a {
      color: #5a3a1a;
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      main {
        flex-direction: column;
      }
      .quote-box, .story-box {
        max-width: 100%;
      }
      footer {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="logo.png" alt="MotivaStory Logo"> <!-- replace with your logo path -->
      <h1>MotivaStory</h1>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <div class="quote-box">
      <h2>🌟 Quote of the Day 🌟</h2>
      <p id="quote">Click below to generate your motivation...</p>
    </div>

    <div class="story-box">
      <h2>📖 Motivational Story</h2>
      <p id="story"></p>
    </div>
  </main>

  <!-- BUTTON -->
  <div class="btn-container">
    <button onclick="getMotivation()">✨ Get New Motivation ✨</button>
  </div>

  <!-- FOOTER -->
  <footer>
    Developed by Yesh | 
    <a href="mailto:yeshwanth8797@gmail.com">yeshwanth8797@gmail.com</a>
  </footer>

  <script>
    async function getMotivation() {
      document.getElementById("quote").innerText = "⏳ Fetching...";
      document.getElementById("story").innerText = "";
      try {
        const res = await fetch("/api/motivation");
        const data = await res.json();
        document.getElementById("quote").innerText = "💬 " + data.quote;
        document.getElementById("story").innerText = "📖 " + data.story;
      } catch (err) {
        document.getElementById("quote").innerText = "⚠️ Failed to load quote";
        document.getElementById("story").innerText = "";
      }
    }
  </script>
</body>
</html>
